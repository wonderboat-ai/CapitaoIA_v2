a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--cap-accent, #00a1fe); outline-offset: 2px; }

@keyframes capVivo { 0%, 100% { opacity: 1; box-shadow: 0 0 0 3px rgba(var(--cap-tele-rgb, 0,244,253), 0.22), 0 0 10px rgba(var(--cap-tele-rgb, 0,244,253), 0.7); } 50% { opacity: 0.18; box-shadow: 0 0 0 0 rgba(var(--cap-tele-rgb, 0,244,253), 0), 0 0 0 rgba(var(--cap-tele-rgb, 0,244,253), 0); } }

@keyframes capSweep { 0% { transform: translateX(-160%) skewX(-16deg); } 42% { transform: translateX(700%) skewX(-16deg); } 100% { transform: translateX(700%) skewX(-16deg); } }
@keyframes capPulse { 0%, 100% { box-shadow: 0 0 0 3px rgba(var(--cap-accent-rgb, 0,161,254), 0.22); } 50% { box-shadow: 0 0 0 6px rgba(var(--cap-accent-rgb, 0,161,254), 0.06); } }

.cap-ia { font-weight: 800; letter-spacing: 0.06em; line-height: 1; white-space: nowrap; background: linear-gradient(120deg, var(--cap-tele, #00f4fd) 0%, var(--cap-accent, #00a1fe) 50%, var(--cap-violeta, #b45cff) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; } }
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--cap-bg, #050816); color: var(--cap-ink, #eaf1ff); overflow: hidden; position: relative;">

          <span style="font-size: 9.5px; letter-spacing: 0.3em; font-weight: 700; color: var(--cap-ink3, #97a3c0);">CÉREBRO OPERACIONAL</span>

          <span title="{{demoTip}}" style="font-size: 9px; letter-spacing: 0.14em; font-weight: 800; color: var(--cap-violeta, #b45cff); border: 1px solid rgba(var(--cap-violeta-rgb, 162,43,253), 0.55); background: rgba(var(--cap-violeta-rgb, 162,43,253), 0.10); border-radius: 5px; padding: 3px 7px; white-space: nowrap;">{{demo}}</span>

        <div style="display: flex; align-items: center; gap: 6px; padding: 10px 10px 10px 18px;">

          <input id="pergunta-m" maxlength="500" ref="{{inputRef}}" onKeyDown="{{onKey}}" placeholder="Pergunte ao barco…" autocomplete="off" enterkeyhint="send" style="flex-grow: 1; background: none; border: none; outline: none; color: var(--cap-ink, #eaf1ff); font-size: 17px; font-family: inherit; min-width: 0; padding: 16px 0;">

      <sc-if value="{{showStatus}}" hint-placeholder-val="{{false}}"><span role="status" style="font-size: 10.5px; letter-spacing: 0.10em; color: {{statusTone}}; line-height: 1.3;">{{status}}</span></sc-if>

    <sc-if value="{{idle}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 2px; flex-grow: 1; min-height: 0; justify-content: space-evenly; padding-bottom: 8px;">

          <span style="display: flex; align-items: center; gap: 5px; font-size: 9px; letter-spacing: 0.12em; font-weight: 700; color: {{painel.ctone}}; border: 1px solid {{painel.cline}}; background: {{painel.cwash}}; border-radius: 5px; padding: 3px 7px; white-space: nowrap;"><span style="width: 5px; height: 5px; flex-shrink: 0; border-radius: 50%; background: {{painel.ctone}};"></span>{{painel.chip}}</span>

      </div>
    </sc-if>
  </div>

  <a href="S2-SOS-Mobile.dc.html" style="flex-shrink: 0; margin: 0 14px 18px; height: 58px; border-radius: 16px; background: var(--cap-crit-fill, #d32f27); color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none; box-shadow: 0 0 0 3px rgba(var(--cap-crit-rgb, 255,59,48), 0.28), 0 10px 26px rgba(var(--cap-critfill-rgb, 211,47,39), 0.40);">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {

      status: s.conversa ? 'CONVERSA ATIVA · OUVINDO · TOQUE EM CONVERSA PARA ENCERRAR' : s.listening ? 'OUVINDO… TOQUE DE NOVO PARA ENVIAR' : s.note ? s.note.toUpperCase() : att ? 'ANEXO PRONTO · DESCREVA E ENVIE' : 'ATALHOS · UM TOQUE ENVIA',
      statusTone: s.conversa || s.listening ? 'var(--cap-accent, #00a1fe)' : s.note ? 'var(--cap-warn, #f0a63a)' : 'var(--cap-ink4, #7985a6)',
      showStatus: !!(s.conversa || s.listening || s.note || att),
      thread: s.thread.map((m) => ({ text: m.text, src: m.src || '', actions: (m.actions || []).map((x) => ({ l: x.l, href: x.href, target: x.ext ? '_blank' : '_self', rel: x.ext ? 'noopener' : '' })), hasActions: !!(m.actions && m.actions.length), justify: m.role === 'user' ? 'flex-end' : 'flex-start', bg: m.role === 'user' ? 'rgba(var(--cap-accent-rgb, 0,161,254), 0.10)' : 'rgba(var(--cap-card-rgb, 13,19,41), 0.9)', line: m.role === 'user' ? 'rgba(var(--cap-accent-rgb, 0,161,254), 0.45)' : 'rgba(var(--cap-hl-rgb, 255,255,255), 0.09)', k: m.role === 'user' ? (window.CapitaoAuth ? window.CapitaoAuth.nome() : 'Lucas').toUpperCase() : 'CAPITÃO IA', ktone: m.role === 'user' ? 'var(--cap-accent, #00a1fe)' : 'var(--cap-tele, #00f4fd)' })),
      chips: atalhos.map((a) => ({ l: a.l, q: a.q, onClick: () => this.ask(a.q, a.id) })),
      painel: atr ? { chip: atr + ' ATRASADAS', ctone: 'var(--cap-crit, #ff3b30)', cline: 'rgba(var(--cap-crit-rgb, 255,59,48), 0.45)', cwash: 'rgba(var(--cap-crit-rgb, 255,59,48), 0.10)' } : { chip: 'EM DIA', ctone: 'var(--cap-ok, #34c77a)', cline: 'rgba(var(--cap-ok-rgb, 52,199,122), 0.45)', cwash: 'rgba(var(--cap-ok-rgb, 52,199,122), 0.08)' },
      faq: this.equipamentos(),
      modesL: [dock(texto, 0), dock(modes[2], 1)], modesR: [dock(modes[0], 1), dock(modes[1], 2)],
      // CONVERSA: círculo com o ∞ (capitao-simbolo.js) saindo de cima do dock. Ativa ou realçada pela dica do link
      // (#mode=conversa): borda e brilho no ritmo ativo e as cores correndo mais rápido; aria-pressed só com a conversa ligada.
      conv: { l: s.conversa ? 'ATIVA' : 'CONVERSA', on: s.conversa ? 'true' : 'false', aria: modes[3].aria, onClick: modes[3].onClick,
        cls: 'cps-botao cps-sep' + (s.conversa || re === 'conversa' ? ' cps-ativo' : ''), ritmo: s.conversa || re === 'conversa' ? 'ativo' : 'repouso' }
    };
  }
}
