<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capitão IA — Mapa de sensores (app)</title>
<script src="./capitao-dados.js"></script>
<script src="./capitao-replay.js"></script>
<script src="./capitao-alertas.js"></script>
<script src="./capitao-sensores.js"></script>
<script src="./capitao-auth.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./capitao-app.js"></script>
<script src="./capitao-theme.js"></script>
<style>
body { margin: 0; font-family: "Nimbus Sans", "Helvetica Neue", Helvetica, Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--cap-bg, #050816); -webkit-font-smoothing: antialiased; }
a { color: var(--cap-accent, #00a1fe); } a:hover { color: var(--cap-link-hover, #5cc2ff); }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--cap-accent, #00a1fe); outline-offset: 2px; }
button { font: inherit; }
</style>
<script src="./capitao-telemetria.js"></script>
<script src="./capitao-brain.js"></script>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--cap-bg, #050816); color: var(--cap-ink, #eaf1ff); overflow: hidden; position: relative;">
  <x-import component-from-global-scope="capitao-topo-app" from="./capitao-moldura.js" titulo="Sensores" voltar="A2-Ponte-Mobile.dc.html" hint-size="390px,44px"></x-import>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto;">
    <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0;">
        <span style="font-size: 11px; letter-spacing: 0.16em; font-weight: 800; color: var(--cap-ink3, #97a3c0);">MAPA DE SENSORES</span>
        <span style="font-size: 12px; color: var(--cap-ink2, #b1bdd6); line-height: 1.35;">{{resumo}}</span>
      </span>
      <span role="status" data-selo="{{notaTom}}" style="display: flex; flex-shrink: 0; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: {{notaCor}};"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: {{notaCor}};"></span>{{nota}}</span>
    </div>

    <section aria-label="Perfil do barco" style="flex-shrink: 0; box-sizing: border-box; padding: 12px 0 10px 14px; background: var(--cap-card, #0d1329); border: 1px solid var(--cap-line, #1a2240); border-radius: 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow: hidden;">
      <div style="display: flex; align-items: baseline; gap: 8px; padding-right: 14px;"><h2 style="margin: 0; font-size: 14.5px; font-weight: 700;">Perfil</h2><span style="font-size: 11.5px; color: var(--cap-ink3, #97a3c0);">proa à direita · deslize para ver o resto</span></div>
      <div role="region" aria-label="Perfil do barco, role para os lados" tabIndex="0" style="overflow-x: auto; overflow-y: hidden; padding-right: 14px; -webkit-overflow-scrolling: touch;">{{perfil}}</div>
    </section>

    <section aria-label="Planta do barco" style="flex-shrink: 0; box-sizing: border-box; padding: 12px 0 10px 14px; background: var(--cap-card, #0d1329); border: 1px solid var(--cap-line, #1a2240); border-radius: 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow: hidden;">
      <div style="display: flex; align-items: baseline; gap: 8px; padding-right: 14px;"><h2 style="margin: 0; font-size: 14.5px; font-weight: 700;">Planta</h2><span style="font-size: 11.5px; color: var(--cap-ink3, #97a3c0);">vista de cima · bombordo em cima</span></div>
      <div role="region" aria-label="Planta do barco, role para os lados" tabIndex="0" style="overflow-x: auto; overflow-y: hidden; padding-right: 14px; -webkit-overflow-scrolling: touch;">{{planta}}</div>
    </section>

    <section aria-label="Todos os sensores" style="flex-shrink: 0; box-sizing: border-box; padding: 12px 14px; background: var(--cap-card, #0d1329); border: 1px solid var(--cap-line, #1a2240); border-radius: 16px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; flex-direction: column; gap: 1px;"><h2 style="margin: 0; font-size: 14.5px; font-weight: 700;">Todos os sensores</h2><span style="font-size: 11.5px; color: var(--cap-ink3, #97a3c0);">{{listaSub}}</span></div>
      <sc-for list="{{lista}}" as="s" hint-placeholder-count="22">
        <div data-sensor="{{s.id}}" title="{{s.titulo}}" style="box-sizing: border-box; padding: 8px 10px; border-radius: 12px; background: var(--cap-row, #10162e); display: flex; flex-direction: column; gap: 2px; min-width: 0;">
          <span style="display: flex; align-items: center; gap: 7px; min-width: 0;"><span aria-hidden="true" style="width: 9px; height: 9px; flex-shrink: 0; border-radius: 50%; background: {{s.cor}};"></span><span style="flex-grow: 1; min-width: 0; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.rotulo}}</span><span style="flex-shrink: 0; font-size: 10.5px; color: var(--cap-ink4, #7985a6);">{{s.vista}}</span></span>
          <span style="font-size: 11px; color: var(--cap-ink3, #97a3c0);">{{s.onde}}</span>
          <span style="font-size: 12.5px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; font-variant-numeric: tabular-nums;">{{s.valores}}</span>
        </div>
      </sc-for>
      <span style="padding-top: 6px; border-top: 1px solid var(--cap-line, #1a2240); font-size: 11px; color: var(--cap-ink4, #7985a6); line-height: 1.35;">{{fonte}}</span>
    </section>
  </div>

  <x-import component-from-global-scope="capitao-sos-app" from="./capitao-moldura.js" hint-size="390px,68px"></x-import>
  <div style="flex-shrink: 0; box-sizing: border-box; padding: 26px 16px 12px; border-top: 1px solid var(--cap-line, #1a2240);">
    <x-import component-from-global-scope="capitao-barra-chat" from="./capitao-barra.js" hint-size="358px,108px"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { vivo: '' };
  componentDidMount() {
    // A cada tique da telemetria (replay ou coletor): monta o texto que a tela exibe (só dado) e só chama setState se ele mudou (o setState refaz a tela inteira).
    this._onTele = () => { if (!document.hidden) this.atualiza(); };
    window.addEventListener('capitao-telemetria', this._onTele);
    window.addEventListener('capitao-rebase', this._onTele);
    this.atualiza();
  }
  componentWillUnmount() { window.removeEventListener('capitao-telemetria', this._onTele); window.removeEventListener('capitao-rebase', this._onTele); }
  atualiza() {
    const d = this.dinamico(), k = JSON.stringify(d);
    if (k === this._k) return;
    this._k = k; this._din = d; this._fresco = true;
    this.setState({ vivo: k });
  }
  // número e unidade na mesma linha: um espaço sem quebra entre o número e a unidade (a unidade nunca cai sozinha na linha de baixo); só no que a tela desenha, nunca no title nem no aria-label
  un(s) { return String(s === null || s === undefined ? '' : s).replace(/(\d) (°C|°|%|rpm|bar|hPa|nós?|kW|V|Ah|L|h|m|cm|mn|ciclos?)(?![A-Za-zÀ-ÿ])/g, '$1\u00a0$2'); }
  dinamico() {
    const S = window.CapitaoSensores, D = window.CapitaoDados || {}, sim = D.simulacao === true, falta = (r) => (sim ? '—' : r);
    const v = S ? S.vistas('app') : { perfil: null, planta: null, hora: '—', fonte: falta('SEM DADOS'), reserva: false }, c = S ? S.contagem() : { total: 0, comValor: 0 };
    const todos = [].concat(v.perfil ? v.perfil.pontos : [], v.planta ? v.planta.pontos : []).sort((a, b) => a.n - b.n);
    const cr = (p) => (p.nivel === 'normal' ? 'var(--cap-ok, #34c77a)' : p.nivel === 'aviso' ? 'var(--cap-warn, #f0a63a)' : p.nivel === 'critico' ? 'var(--cap-crit, #ff3b30)' : 'var(--cap-ink3, #97a3c0)');
    return { v: v, c: c, hora: v.hora, fonte: v.fonte, reserva: v.reserva,
      lista: todos.map((p) => ({ id: p.id, rotulo: p.rotulo, onde: p.onde, vista: p.vista, cor: cr(p), titulo: p.titulo, valores: this.un(p.itens.map((it) => it.k + ' ' + it.v).join(' · ')) })) };
  }
  renderVals() {
    const S = window.CapitaoSensores;
    let d = this._din;
    if (!this._fresco || !d) { d = this._din = this.dinamico(); this._k = JSON.stringify(d); }
    this._fresco = false;
    const vivo = !d.reserva, cor = vivo ? 'var(--cap-ok, #34c77a)' : 'var(--cap-warn, #f0a63a)';
    const n = (vw) => (vw ? vw.pontos.length : 0);
    return {
      resumo: d.c.comValor + ' de ' + d.c.total + ' sensores na rede · ' + (d.reserva ? 'leitura de ' : 'ao vivo ') + d.hora,
      nota: (vivo ? 'Ao vivo · ' : 'Última leitura · ') + d.hora, notaTom: vivo ? 'ok' : 'warn', notaCor: cor,
      perfil: S && d.v.perfil ? S.elemento(d.v.perfil, { altura: 330, modo: 'app', rotulo: 'Perfil do barco: ' + n(d.v.perfil) + ' sensores e o valor de agora' }) : null,
      planta: S && d.v.planta ? S.elemento(d.v.planta, { altura: 330, modo: 'app', rotulo: 'Planta do barco: ' + n(d.v.planta) + ' sensores e o valor de agora' }) : null,
      lista: d.lista, listaSub: d.lista.length + ' pontos, o valor de cada um no instante da leitura',
      fonte: 'Fonte: ' + d.fonte.replace(/^Fonte: /, '') + ' · posições do inventário de bordo · desenho esquemático, as posições são aproximadas'
    };
  }
}
</script>
</body>
</html>
