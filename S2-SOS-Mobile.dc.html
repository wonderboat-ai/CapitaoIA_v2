<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capitão IA — SOS (app)</title>
<script src="./capitao-dados.js"></script>
<script src="./capitao-auth.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./capitao-app.js"></script>
<style>
body { margin: 0; font-family: "Nimbus Sans", "Helvetica Neue", Helvetica, Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #050816; -webkit-font-smoothing: antialiased; }
a { color: #00a1fe; } a:hover { color: #5cc2ff; }
a:focus-visible, button:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
button { font: inherit; }
@keyframes capSirene { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
@keyframes capFaroE { 0%, 50%, 100% { opacity: 0.12; } 12%, 34% { opacity: 1; } }
@keyframes capFaroD { 0%, 50%, 100% { opacity: 1; } 62%, 84% { opacity: 0.12; } }
@keyframes capCupula { 0%, 100% { fill-opacity: 0.45; } 50% { fill-opacity: 1; } }
@keyframes capHalo { 0%, 100% { transform: scale(0.72); opacity: 0.12; } 50% { transform: scale(1.12); opacity: 0.7; } }
@keyframes capBrilho { 0%, 100% { box-shadow: 0 0 0 1px rgba(255,90,80,0.3), 0 8px 24px rgba(255,40,30,0.2); } 50% { box-shadow: 0 0 0 1px rgba(255,120,110,0.55), 0 8px 30px rgba(255,40,30,0.45); } }
.cap-sirene { animation: capSirene 2s ease-in-out infinite; }
.cap-faro-e { animation: capFaroE 1.4s linear infinite; }
.cap-faro-d { animation: capFaroD 1.4s linear infinite; }
.cap-cupula { animation: capCupula 1.4s ease-in-out infinite; }
.cap-halo { transform-box: fill-box; transform-origin: center; animation: capHalo 1.4s ease-in-out infinite; }
.cap-brilho { animation: capBrilho 1.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .cap-sirene, .cap-faro-e, .cap-faro-d, .cap-cupula, .cap-halo, .cap-brilho { animation-duration: 3.2s; } }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #050816; color: #eaf1ff; overflow: hidden; position: relative; isolation: isolate; padding: 14px 16px 18px; gap: 10px;">
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; opacity: {{sireneOp}}; transition: opacity .5s;">
    <div class="cap-sirene" style="position: absolute; inset: 0; box-shadow: inset 0 0 0 3px rgba(255,59,48,0.85), inset 0 0 70px 6px rgba(255,40,30,0.45); background: linear-gradient(180deg, rgba(255,40,30,0.14) 0%, rgba(255,40,30,0) 22%, rgba(255,40,30,0) 78%, rgba(255,40,30,0.10) 100%);"></div>
  </div>

  <div class="cap-brilho" style="position: relative; flex-shrink: 0; box-sizing: border-box; padding: 16px; background: #d32f27; border-radius: 22px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #ffffff; text-align: center;">
    <a href="H2-Home-Mobile.dc.html" aria-label="Fechar e voltar ao início" style="position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.18); color: #ffffff; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 18px;">✕</a>
    <svg width="56" height="56" viewBox="0 0 64 64" fill="none" role="img" aria-label="Luz de alerta" style="display: block; overflow: visible; flex-shrink: 0;"><circle class="cap-halo" cx="32" cy="34" r="24" style="fill: rgba(255,255,255,0.55);"></circle><path class="cap-faro-e" d="M14 23L6 18 M12 33H3 M14 43L6 48" stroke-width="3.2" stroke-linecap="round" style="stroke: #ffffff;"></path><path class="cap-faro-d" d="M50 23L58 18 M52 33H61 M50 43L58 48" stroke-width="3.2" stroke-linecap="round" style="stroke: #ffffff;"></path><path class="cap-cupula" d="M20 46V32a12 12 0 0 1 24 0v14z" style="fill: #ffffff;"></path><path d="M20 46V32a12 12 0 0 1 24 0v14z" stroke-width="2" stroke-linejoin="round" style="stroke: #ffffff;"></path><path d="M26 32a6 6 0 0 1 6-6" stroke-width="2.4" stroke-linecap="round" style="stroke: rgba(255,255,255,0.85);"></path><rect x="13" y="46" width="38" height="8" rx="2.5" style="fill: rgba(255,255,255,0.92);"></rect></svg>
    <span style="font-size: 30px; font-weight: 800; letter-spacing: 0.08em; line-height: 1;">EMERGÊNCIA</span>
    <span style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11.5px; color: #ffe0dd; line-height: 1.4;">{{marca}}</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto;">
    <sc-for list="{{proto}}" as="p" hint-placeholder-count="4">
      <button type="button" onClick="{{p.toggle}}" aria-expanded="{{p.open}}" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 12px; background: {{p.bg}}; border: 1px solid {{p.line}}; border-radius: 14px; color: #eaf1ff; cursor: pointer; text-align: left; font-family: inherit; width: 100%; box-sizing: border-box; flex-shrink: 0;">
        <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: {{p.wash}}; display: flex; align-items: center; justify-content: center;">{{p.ico}}</span>
        <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
          <span style="font-size: 14.5px; font-weight: 700;">{{p.n}}</span>
          <span style="font-size: 12.5px; color: #c6cfe2; line-height: 1.35;">{{p.s}}</span>
        </span>
        <span style="margin-left: auto; display: flex;">{{p.chev}}</span>
      </button>
      <sc-if value="{{p.open}}" hint-placeholder-val="{{false}}">
        <div style="margin: -4px 0 2px; padding: 10px 12px 10px 14px; border-radius: 0 0 14px 14px; background: #0e1430; border: 1px solid #2b3560; border-top: none; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;">
          <span style="font-size: 10px; letter-spacing: 0.12em; font-weight: 800; color: {{p.rotTone}};">{{p.rot}}</span>
          <sc-for list="{{p.steps}}" as="st" hint-placeholder-count="3">
            <span style="display: flex; gap: 9px; align-items: flex-start;"><span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%; background: rgba(255,59,48,0.14); color: #ff6a60; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;">{{st.n}}</span><span style="font-size: 12.5px; line-height: 1.4; padding-top: 1px;">{{st.t}}</span></span>
          </sc-for>
          <span style="font-size: 10.5px; color: #97a3c0; line-height: 1.4;">{{p.src}}</span>
          <sc-if value="{{p.href}}" hint-placeholder-val="{{false}}"><a href="{{p.href}}" style="align-self: flex-start; min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid rgba(0,161,254,0.5); background: rgba(0,161,254,0.12); color: #4dbcff; font-size: 10.5px; letter-spacing: 0.10em; font-weight: 700; display: flex; align-items: center; text-decoration: none;">{{p.hl}} ›</a></sc-if>
        </div>
      </sc-if>
    </sc-for>
    <sc-if value="{{mayday}}" hint-placeholder-val="{{false}}">
      <div style="padding: 12px 14px; border-radius: 14px; background: rgba(255,59,48,0.10); border: 1px solid rgba(255,59,48,0.45); display: flex; flex-direction: column; gap: 5px; flex-shrink: 0;">
        <span style="font-size: 10px; letter-spacing: 0.14em; font-weight: 800; color: #ff6a60;">ROTEIRO · CANAL 16 · 156,800 MHz · REPETIR ATÉ RESPOSTA</span>
        <sc-for list="{{roteiro}}" as="r" hint-placeholder-count="8">
          <span style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; line-height: 1.35; color: #ffffff;">{{r}}</span>
        </sc-for>
        <span style="font-size: 10.5px; color: #b1bdd6; line-height: 1.4;">{{rotuloRoteiro}}</span>
      </div>
    </sc-if>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; padding-top: 4px;">
      <button type="button" onClick="{{toggleMayday}}" aria-pressed="{{mayday}}" style="height: 60px; border-radius: 16px; border: none; background: #eaf1ff; color: #050816; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink: 0;"><path d="M4 9h16v11H4z M8 4l8 5 M8 13h.01 M8 16h.01 M12 13h5 M12 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font-size: 16px; font-weight: 800; letter-spacing: 0.06em;">{{maydayLabel}}</span></button>
      <div style="display: flex; gap: 8px;">
        <sc-for list="{{chamar}}" as="c" hint-placeholder-count="2">
          <a href="{{c.href}}" aria-label="{{c.aria}}" title="{{c.aria}}" style="flex: 1 1 0; min-width: 0; height: 52px; border-radius: 14px; border: 1px solid #34406a; background: #131a33; color: #eaf1ff; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 13px; font-weight: 700;">{{c.ico}}<span style="display: flex; flex-direction: column; line-height: 1.15; min-width: 0;"><span>{{c.n}}</span><span style="font-size: 10px; font-weight: 600; color: {{c.subTone}};">{{c.sub}}</span></span></a>
        </sc-for>
        <button type="button" onClick="{{silence}}" aria-pressed="{{muted}}" aria-label="Pausar a sirene visual por 60 segundos" style="flex: 1 1 0; min-width: 0; height: 52px; border-radius: 14px; border: 1px solid {{silenceLine}}; background: #0d1329; color: {{silenceTone}}; font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 0 6px;">{{silenceLabel}}</button>
      </div>
      <a href="H2-Home-Mobile.dc.html" style="text-align: center; font-size: 12.5px; font-weight: 600; color: #97a3c0; text-decoration: none; padding: 8px; min-height: 28px;">Voltar ao início</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { open: -1, mayday: false, left: 0, reg: null, fones: {} };
  componentDidMount() { this.whenBrain((B) => this.setState({ reg: this.registrar(B), fones: B.loadEquipe().fones }), () => this.setState({ reg: { falhou: true } })); }
  componentWillUnmount() { clearInterval(this._t); clearInterval(this._b); }
  // SOS abre rápido e offline: o cérebro entra depois, só para gravar no diário e ler os telefones do aparelho.
  whenBrain(cb, fail) {
    if (window.CapitaoBrain) return cb(window.CapitaoBrain);
    let n = 0;
    this._b = setInterval(() => {
      if (window.CapitaoBrain || ++n > 120) { clearInterval(this._b); if (window.CapitaoBrain) cb(window.CapitaoBrain); else fail(); return; }
      if (n === 1 && !document.querySelector('script[src*="capitao-brain.js"]')) { const s = document.createElement('script'); s.src = './capitao-brain.js'; s.setAttribute('data-capitao-brain', '1'); document.head.appendChild(s); }
    }, 50);
  }
  // SOS acionado: uma linha no diário por acionamento (10 min · vale também para a tela web). Só diz "gravado" se a linha está no diário.
  registrar(B) {
    const K = 'capitao.sos.v1'; let prev = null;
    try { prev = JSON.parse(sessionStorage.getItem(K) || 'null'); } catch (e) {}
    if (prev && prev.t && Date.now() - prev.em < 600e3) return prev;
    const n = B.now(); let e = null;
    try { e = B.addDiario({ sys: 'Segurança', tone: 'var(--cap-crit, #ff3b30)', t: 'SOS acionado no app às ' + n.t + ' · último fix ' + this.pos() + '.', who: (window.CapitaoAuth ? window.CapitaoAuth.nome() : 'Lucas'), src: 'app · SOS' }); } catch (x) {}
    if (!e || !B.loadDiario().some((x) => x.iso === e.iso && x.src === 'app · SOS')) return { falhou: true };
    const r = { em: Date.now(), t: n.t };
    try { sessionStorage.setItem(K, JSON.stringify(r)); } catch (x) {}
    return r;
  }
  // Posição salva é o último fix do snapshot (ou da telemetria ao vivo, se ligada) — nunca a posição de agora: o roteiro manda ler o plotter.
  pos() {
    const D = window.CapitaoDados || {}, S = D.snapshot || {}, g = S.gps || {};
    return (g.texto || 'posição SEM LEITURA') + ' (' + (D.demo ? 'snapshot DEMO ' : 'snapshot ') + (S.quando || 'SEM DADOS') + ')';
  }
  silence() {
    if (this.state.left > 0) { clearInterval(this._t); this.setState({ left: 0 }); return; }
    this.setState({ left: 60 }); clearInterval(this._t);
    this._t = setInterval(() => { const l = this.state.left - 1; if (l <= 0) { clearInterval(this._t); this.setState({ left: 0 }); } else this.setState({ left: l }); }, 1000);
  }
  ico(d, n, sw, stroke) { const h = React.createElement; return h('svg', { width: n, height: n, viewBox: '0 0 24 24', fill: 'none', 'aria-hidden': 'true', style: { flexShrink: 0, display: 'block' } }, h('path', { d: d, strokeWidth: sw || 1.8, strokeLinecap: 'round', strokeLinejoin: 'round', style: { stroke: stroke || 'currentColor' } })); }
  renderVals() {
    const s = this.state, D = window.CapitaoDados || {}, P = D.protocolos || {}, E = D.embarcacao || {}, r = s.reg;
    const ROT = (P.rotulo || 'procedimento padrão — confirmar com o protocolo de bordo').toUpperCase();
    const mmsi = E.mmsi ? 'MMSI ' + E.mmsi + (E.mmsiNota ? ' (' + E.mmsiNota + ')' : '') : 'MMSI SEM DADOS';
    const fonteP = 'Fonte: ' + (P.fonte || 'protocolo de emergência');
    const docs = 'G1-Documentos-Mobile.dc.html', faq3 = 'F3-FAQ-Eletronicos.dc.html';
    const RED = { tone: '#ff6a60', wash: 'rgba(255,59,48,0.16)', bg: '#2a1520', line: 'rgba(255,59,48,0.6)' };
    const STD = { tone: '#eaf1ff', wash: 'rgba(255,255,255,0.08)', bg: '#131a33', line: '#2b3560' };
    const SEM = { tone: '#f0a63a', wash: 'rgba(240,166,58,0.14)', bg: '#131a33', line: 'rgba(240,166,58,0.45)' };
    const L = [
      Object.assign({ n: 'VHF Canal 16 — MAYDAY', s: mmsi + ' · rádios VHF 315', d: 'M4 9h16v11H4z M8 4l8 5 M8 13h.01 M8 16h.01 M12 13h5 M12 16h5', rot: ROT, rotTone: '#f0a63a', steps: [{ n: '1', t: 'Canal 16 · 156,800 MHz. Só MAYDAY em perigo grave e iminente; urgência sem risco de vida é PAN-PAN ×3.' }, { n: '2', t: 'Abra o roteiro em CANAL 16 · MAYDAY e leia devagar: nome ×3, MMSI, posição lida no plotter, natureza do perigo, pessoas a bordo, auxílio.' }, { n: '3', t: 'Repita até ter resposta. Rádio com DSC: o botão DISTRESS envia o alerta com o MMSI programado; depois, a chamada por voz no 16.' }], src: fonteP + ' · canal 16 e MMSI informados pelo proprietário', href: '', hl: '' }, RED),
      Object.assign({ n: 'Homem ao mar (MOB)', s: 'Grite, jogue a boia, aponte e marque MOB no plotter Garmin', d: 'M12 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M8 13l4-4 4 4 M3 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0', rot: ROT, rotTone: '#f0a63a', steps: (P.mob || []).map((t, i) => ({ n: String(i + 1), t: t })), src: fonteP + ' · ' + ((D.guias && D.guias.g_eletronicos) || '') + ' §1', href: faq3, hl: 'FAQ eletrônicos' }, STD),
      Object.assign({ n: 'Incêndio · Seafire', s: 'SEM DADOS — localização, acionamento e tempo de espera não carregados', d: 'M12 3s5 5.5 5 9a5 5 0 0 1-10 0c0-3.5 5-9 5-9z', rot: 'SEM DADOS', rotTone: '#f0a63a', steps: [{ n: '!', t: 'O procedimento do sistema Seafire não foi carregado: não há passo a passo confirmado.' }, { n: '1', t: 'Perigo grave e iminente: MAYDAY no canal 16 (roteiro abaixo).' }], src: 'Fonte: nenhuma para o Seafire — enviar o manual ou o protocolo de bordo', href: '', hl: '' }, SEM),
      Object.assign({ n: 'EPIRB', s: 'SEM DADOS — modelo, localização a bordo e acionamento não carregados', d: 'M12 21V9 M8 5a6 6 0 0 1 8 0 M5 2a10 10 0 0 1 14 0 M9 21h6', rot: 'SEM DADOS', rotTone: '#f0a63a', steps: [{ n: '!', t: 'Modelo, localização, forma de acionamento e validade da bateria do EPIRB não foram carregados.' }, { n: '1', t: 'Envie a foto da etiqueta e do certificado para completar este item.' }], src: 'Fonte: nenhuma para o EPIRB — ' + mmsi, href: docs, hl: 'Documentos' }, SEM)
    ];
    const eq = 'G4-Equipe-Mobile.dc.html', fone = 'M6.5 4h4l1.5 4-2.2 1.6a12 12 0 0 0 4.6 4.6L16 12l4 1.5v4a2 2 0 0 1-2.2 2A15.5 15.5 0 0 1 4.5 6.2 2 2 0 0 1 6.5 4z';
    const liga = (id, n, quem) => { const f = s.fones[id]; return f ? { n: n, sub: 'ligar', subTone: '#34c77a', href: 'tel:' + String(f).replace(/[^+\d]/g, ''), aria: 'Ligar para ' + quem + ' · ' + f, ico: this.ico(fone, 17) } : { n: n, sub: 'cadastrar tel.', subTone: '#97a3c0', href: eq, aria: 'Telefone de ' + quem + ' não cadastrado — abrir Equipe para cadastrar', ico: this.ico(fone, 17) }; };
    const pos = this.pos();
    return {
      marca: pos + ' · ' + (!r ? 'gravando no diário de bordo…' : r.falhou ? 'não gravado — registre posição e hora no diário' : 'SOS ' + r.t + ' · gravado no diário de bordo'),
      chamar: [liga('marina', 'Marina', 'a marina da base'), liga('tecnico', 'Técnico', 'o técnico de bordo')],
      proto: L.map((p, i) => Object.assign({}, p, { ico: this.ico(p.d, 22, 1.8, p.tone), open: s.open === i, toggle: () => this.setState({ open: s.open === i ? -1 : i }), chev: this.ico(s.open === i ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6', 16, 2, '#97a3c0') })),
      mayday: s.mayday, toggleMayday: () => this.setState({ mayday: !s.mayday }), maydayLabel: s.mayday ? 'FECHAR ROTEIRO' : 'CANAL 16 · MAYDAY',
      // Roteiro lido no canal 16: a posição salva é o último fix, não a atual — manda ler o plotter
      roteiro: (P.roteiro || []).map((l) => (/^POSIÇÃO/.test(l) ? l + ' (último fix ' + pos + ')' : l)),
      rotuloRoteiro: 'Procedimento padrão — confirmar com o protocolo de bordo. Urgência sem perigo de vida: PAN-PAN ×3. ' + fonteP.replace('Fonte: ', 'Fonte: ') + '.',
      silence: () => this.silence(), muted: s.left > 0, silenceLabel: s.left > 0 ? 'Pausada · ' + s.left + ' s' : 'Pausar sirene', sireneOp: s.left > 0 ? 0 : 1, silenceLine: s.left > 0 ? 'rgba(240,166,58,0.55)' : '#27315a', silenceTone: s.left > 0 ? '#f0a63a' : '#eaf1ff'
    };
  }
}
</script>
</body>
</html>
