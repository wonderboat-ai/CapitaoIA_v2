<!doctype html>

button { font: inherit; }
</style>
<script src="./capitao-telemetria.js"></script>
<script src="./capitao-brain.js"></script>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--cap-bg, #050816); color: var(--cap-ink, #eaf1ff); overflow: hidden; position: relative;">
  <x-import component-from-global-scope="capitao-topo-app" from="./capitao-moldura.js" titulo="Console" voltar="H2-Home-Mobile.dc.html" hint-size="390px,44px"></x-import>

      <span style="font-size: 11px; color: var(--cap-ink4, #7985a6);">{{fonte}}</span>

</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

    medidor: { n: 'Medidor', d: 'M4 17a8 8 0 1 1 16 0 M12 17l4-5 M4 17h2 M18 17h2', tom: 'ok' },
    tanque: { n: 'Tanque', d: 'M5 6h14v12H5z M5 13h14', tom: 'accent' },

    grafico: { n: 'Gráfico', d: 'M3 12h4l2-6 3 12 2.5-8 1.5 4h5', tom: 'tele' },
    alerta: { n: 'Alerta', d: 'M12 4 21 20H3z M12 10v4 M12 17h.01', tom: 'crit' },
    ancora: { n: 'Âncora', d: 'M12 2.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z M12 7.5V21 M4 13a8 8 0 0 0 16 0 M2.5 13H6 M18 13h3.5', tom: 'accent' },
    estrela: { n: 'Estrela', d: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z', tom: 'violeta' },
    sino: { n: 'Sino', d: 'M6 16V11a6 6 0 0 1 12 0v5l2 2H4z M10 20a2 2 0 0 0 4 0', tom: 'warn' }
  };
  // 8 padrão + 17 no banco. Tela: href · pergunta pronta: q (abre o chat do app em H2-Home-Mobile.dc.html#q=…)
  CATALOGO = [
    { id: 'motores', label: 'Motores', icon: 'motor', href: 'B2-Carta-Mobile.dc.html', destino: 'Gestão · sistemas' },
    { id: 'manutencao', label: 'Manutenção', icon: 'chave', href: 'C2-Leme-Mobile.dc.html', destino: 'Manutenção' },
    { id: 'telemetria', label: 'Telemetria', icon: 'onda', href: 'E1-Navegando-Gatilhos.dc.html', destino: 'Navegando · gatilhos' },
    { id: 'documentos', label: 'Documentos', icon: 'doc', href: 'G1-Documentos-Mobile.dc.html', destino: 'Documentos' },
    { id: 'equipamentos', label: 'Equipamentos', icon: 'painel', href: 'F1-FAQ-Hub.dc.html', destino: 'FAQ dos equipamentos' },
    { id: 'navegacao', label: 'Navegação', icon: 'bussola', href: 'E1-Navegando-Gatilhos.dc.html', destino: 'Navegando · gatilhos' },
    { id: 'abastecer', label: 'Abastecer', icon: 'bomba', href: 'G2-Abastecimento-Mobile.dc.html', destino: 'Abastecimento' },
    { id: 'diario', label: 'Diário', icon: 'livro', href: 'G3-Diario-Mobile.dc.html', destino: 'Diário de bordo' },
    { id: 'gerador', label: 'Gerador', icon: 'raio', href: 'F4-FAQ-Gerador.dc.html', destino: 'FAQ · gerador' },
    { id: 'climatizacao', label: 'Climatização', icon: 'floco', href: 'F5-FAQ-Climatizacao.dc.html', destino: 'FAQ · climatização' },
    { id: 'estabilizador', label: 'Estabilizador', icon: 'giro', href: 'F2-FAQ-Estabilizador.dc.html', destino: 'FAQ · estabilizador' },
    { id: 'eletronicos', label: 'Eletrônicos', icon: 'tela', href: 'F3-FAQ-Eletronicos.dc.html', destino: 'FAQ · eletrônicos' },
    { id: 'equipe', label: 'Equipe', icon: 'pessoas', href: 'G4-Equipe-Mobile.dc.html', destino: 'Equipe e acessos' },
    { id: 'sistemas', label: 'Sistemas', icon: 'grade', href: 'B2-Carta-Mobile.dc.html', destino: 'Gestão · sistemas' },
    { id: 'mare', label: 'Maré', icon: 'mare', q: 'Maré agora' },
    { id: 'clima', label: 'Clima', icon: 'nuvem', q: 'Clima agora' },
    { id: 'autonomia', label: 'Autonomia', icon: 'medidor', q: 'Autonomia com o diesel a bordo' },
    { id: 'tanques', label: 'Tanques', icon: 'tanque', q: 'Nível dos tanques agora' },
    { id: 'porao', label: 'Porão', icon: 'gota', q: 'Situação do porão e das bombas' },
    { id: 'canal16', label: 'Canal 16', icon: 'radio', q: 'Roteiro do canal 16' },
    { id: 'horimetros', label: 'Horímetros', icon: 'relogio', q: 'Horímetros dos motores e do gerador' },
    { id: 'posicao', label: 'Posição', icon: 'pino', q: 'Posição agora' },
    { id: 'checklist', label: 'Checklist', icon: 'lista', q: 'Checklist de saída' },
    { id: 'consumo', label: 'Consumo', icon: 'grafico', q: 'Consumo de diesel' },
    { id: 'anomalias', label: 'Anomalias', icon: 'alerta', q: 'Anomalias abertas' }
  ];
  PADRAO = ['motores', 'manutencao', 'telemetria', 'documentos', 'equipamentos', 'navegacao', 'abastecer', 'diario'];
  porId(id) { return this.CATALOGO.filter((b) => b.id === id)[0] || null; }
  hrefDe(b) { return b.q ? 'H2-Home-Mobile.dc.html#q=' + encodeURIComponent(b.q) : b.href; }
  padrao() { return this.PADRAO.map((id) => { const b = this.porId(id); return { id: b.id, label: b.label, icon: b.icon }; }); }
  // Lê e valida o que está salvo neste aparelho (id do catálogo, sem repetir, até 8, ícone do conjunto); null = nada salvo → padrão
  carregar() {
    try {
      const v = JSON.parse(localStorage.getItem(this.CHAVE) || 'null');
      if (!Array.isArray(v)) return null;
      const vistos = {};
      return v.filter((x) => x && typeof x.id === 'string' && this.porId(x.id) && !vistos[x.id] && (vistos[x.id] = 1)).slice(0, this.MAX)
        .map((x) => { const b = this.porId(x.id); return { id: b.id, label: b.label, icon: typeof x.icon === 'string' && this.ICONES[x.icon] ? x.icon : b.icon }; });
    } catch (e) { return null; }
  }
  state = { blocos: null, exec: {}, diarioLocal: [] };
  componentDidMount() {
    this.setState({ blocos: this.carregar() });
    this.whenBrain(() => this.setState({ exec: window.CapitaoBrain.loadExec(), diarioLocal: window.CapitaoBrain.loadDiario() }));
    // Outra aba/tela gravou: blocos (A3), Executado (C1/C2) ou diário
    this._st = (e) => {
      const k = e ? e.key : null;
      if (k === null || k === this.CHAVE) this.setState({ blocos: this.carregar() });
      if (window.CapitaoBrain && (k === null || k === 'capitao.executado.v1' || k === 'capitao.diario.v1')) this.setState({ exec: window.CapitaoBrain.loadExec(), diarioLocal: window.CapitaoBrain.loadDiario() });
    };
    window.addEventListener('storage', this._st);
  }
  componentWillUnmount() { window.removeEventListener('storage', this._st); }
  whenBrain(cb) {
    if (window.CapitaoBrain) return cb();
    let n = 0;
    const t = setInterval(() => {
      if (window.CapitaoBrain || ++n > 120) { clearInterval(t); if (window.CapitaoBrain) cb(); return; }
      if (n === 6 && !document.querySelector('script[data-capitao-brain]')) { const s = document.createElement('script'); s.src = './capitao-brain.js'; s.setAttribute('data-capitao-brain', '1'); document.head.appendChild(s); }
    }, 50);
  }
  ico(d, n, sw, stroke) { const h = React.createElement; return h('svg', { width: n, height: n, viewBox: '0 0 24 24', fill: 'none', 'aria-hidden': 'true', style: { flexShrink: 0, display: 'block' } }, h('path', { d: d, strokeWidth: sw || 1.7, strokeLinecap: 'round', strokeLinejoin: 'round', style: { stroke: stroke || 'currentColor' } })); }
  // Linha de estado de cada bloco, tirada dos dados (capitao-dados.js + Executado/diário deste aparelho)
  estados(D, ex, diarioLocal) {
    const S = D.snapshot || {}, AG = D.agenda || [], M = S.motores || {}, GE = S.gerador || {}, SK = S.seakeeper || {}, DI = S.diesel || {}, T = S.tanques || {}, G = S.gps || {};
    const AUT = D.autonomia || {}, CON = D.consumo || {}, P = D.protocolos || {}, EQ = D.equipe || {}, FAQ = D.faq || {};
    const SD = 'SEM DADOS', SL = 'SEM LEITURA', demo = D.demo ? ' DEMO' : '';
    const num = (x) => typeof x === 'number' && isFinite(x);
    const nb = (x, d) => (num(x) ? x.toFixed(d == null ? 1 : d).replace('.', ',') : '—');
    const mil = (x) => (num(x) ? String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '—');
    const horas = (x) => { if (!num(x)) return '—'; const p = x.toFixed(1).split('.'); return mil(+p[0]) + ',' + p[1]; };
    const g3 = (x) => (num(x) ? ('00' + Math.round(((x % 360) + 360) % 360)).slice(-3) + '°' : '—');
    const par = (a, i) => (Array.isArray(a) ? a[i] : null);
    const hm = (s) => String(s || '').slice(-5);
    const atrasadas = (ids) => AG.filter((t) => (!ids || ids.indexOf(t.id) !== -1) && t.dn < 0 && !ex[t.id]);
    const aberta = (id) => AG.filter((t) => t.id === id && !ex[t.id])[0] || null;
    const CRIT = 'var(--cap-crit, #ff3b30)', WARN = 'var(--cap-warn, #f0a63a)';
    const e = {};
    const nAtr = atrasadas().length;
    e.motores = { sub: Array.isArray(M.horimetro) ? 'BB ' + horas(par(M.horimetro, 0)) + ' h · BE ' + horas(par(M.horimetro, 1)) + ' h' : 'horímetros ' + SL, badge: atrasadas(['motores-oleo', 'motores-revisao']).length };
    e.manutencao = { sub: (nAtr ? nAtr + (nAtr === 1 ? ' atrasada' : ' atrasadas') : 'nada atrasado') + ' · ' + AG.length + ' tarefas', badge: nAtr, tom: nAtr ? CRIT : '' };
    e.telemetria = { sub: S.hora ? 'snapshot' + demo + ' ' + S.hora : 'snapshot ' + SD };
    const docs = (D.documentos || []).filter((d) => num(d.dn) && d.dn >= 0).sort((a, b) => a.dn - b.dn);
    e.documentos = docs[0] ? { sub: docs[0].n.split(' ')[0].toLowerCase() + ' vence em ' + docs[0].dn + ' d', tom: docs[0].dn <= 30 ? WARN : '' } : { sub: 'vencimentos ' + SD };
    const guias = Object.keys(FAQ).filter((k) => FAQ[k] && FAQ[k].status === 'PRONTO').length;
    e.equipamentos = { sub: guias ? guias + ' guias PRONTO' + (demo ? ' ·' + demo : '') : 'guias ' + SD };
    e.navegacao = { sub: String(S.estado || SD).toLowerCase() + ' · ' + (num(S.sog) ? nb(S.sog) + (S.sog < 2 ? ' nó' : ' nós') : SL) + ' · ' + g3(S.proa) };
    e.abastecer = { sub: num(DI.litros) ? '≈ ' + mil(DI.litros) + ' L' + (num(DI.bb) && num(DI.be) ? ' · ' + Math.round((DI.bb + DI.be) / 2) + ' %' : '') : 'diesel ' + SL };
    const loc = (diarioLocal || [])[0], fon = (D.diario || [])[0];
    const hLoc = loc && loc.iso ? (() => { try { const d = new Date(loc.iso); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); } catch (x) { return ''; } })() : '';
    e.diario = { sub: loc ? 'último ' + (loc.d || '') + (hLoc ? ' ' + hLoc : '') : fon ? 'último ' + fon.d + ' ' + fon.h : 'diário ' + SD };
    e.gerador = { sub: 'Onan · ' + (num(GE.horas) ? horas(GE.horas) + ' h' : SL) + (GE.estado ? ' · ' + GE.estado.split(' ')[0] : ''), badge: atrasadas(['gerador-rotor', 'gerador-revisao']).length };
    const filtro = aberta('clima-filtro');
    e.climatizacao = { sub: filtro && filtro.dn < 0 ? 'filtro ' + filtro.rot : (FAQ.climatizacao && FAQ.climatizacao.status === 'PRONTO' ? 'guia PRONTO' + (demo ? ' ·' + demo : '') : 'guia ' + SD), badge: atrasadas(['clima-filtro', 'clima-revisao']).length, tom: filtro && filtro.dn < 0 ? CRIT : '' };
    e.estabilizador = { sub: 'Seakeeper · ' + (SK.estado || SL) + (SK.hora ? ' ' + hm(SK.hora) : ''), badge: atrasadas(['seakeeper-anodo']).length };
    e.eletronicos = { sub: FAQ.eletronicos && FAQ.eletronicos.equip ? FAQ.eletronicos.equip.replace(/^Eletrônicos\s+/, '') : SD, badge: atrasadas(['garmin-cartas']).length };
    e.equipe = { sub: (EQ.perfis || []).length + ((EQ.perfis || []).length === 1 ? ' perfil' : ' perfis') + ' · ' + (EQ.apoio || []).length + ' de apoio' };
    const eqs = D.equipamentos || [], semModelo = eqs.filter((x) => !x.modelo).length;
    e.sistemas = { sub: eqs.length + ' equipamentos · ' + semModelo + ' modelos ' + SD };
    e.mare = { sub: 'ref. ' + ((D.posicaoRef && D.posicaoRef.nome) || SD) };
    e.clima = { sub: 'vento ' + (num(S.vento) ? nb(S.vento) + ' nós' : SL) + ' · ' + (num(S.pressao) ? nb(S.pressao, 0) + ' hPa' : SL) };
    e.autonomia = { sub: num(AUT.horas) ? '≈ ' + nb(AUT.horas) + ' h · ≈ ' + mil(AUT.mn) + ' mn' : 'autonomia ' + SD };
    e.tanques = { sub: 'água ' + (num(T.agua) ? Math.round(T.agua) + ' %' : SL) + ' · negras ' + (num(T.negras) ? Math.round(T.negras) + ' %' : SL) };
    const porao = aberta('porao-teste');
    e.porao = { sub: (S.porao == null ? SL : 'sensor na rede') + (porao && porao.dn < 0 ? ' · teste ' + porao.rot : ''), badge: atrasadas(['porao-teste']).length, tom: porao && porao.dn < 0 ? CRIT : '' };
    e.canal16 = { sub: P.canal16 ? 'canal ' + P.canal16.canal + ' · ' + P.canal16.mhz + ' MHz' : 'canal 16 · ' + SD };
    e.horimetros = { sub: Array.isArray(M.horimetro) ? 'BB ' + horas(par(M.horimetro, 0)) + ' · BE ' + horas(par(M.horimetro, 1)) + ' · ger. ' + horas(GE.horas) : SL };
    e.posicao = { sub: G.texto || 'posição ' + SL };
    e.checklist = { sub: (D.guias && D.guias.checklist) || SD };
    e.consumo = { sub: CON.cruzeiro ? nb(CON.cruzeiro.lph, 0) + ' L/h a ' + CON.cruzeiro.nos + ' nós' + (CON.lenta ? ' · lenta ' + nb(CON.lenta.lph) + ' L/h' : '') : 'consumo ' + SD };
    const pend = (D.diario || []).filter((x) => x.pend).length;
    e.anomalias = { sub: pend + (pend === 1 ? ' pendência aberta' : ' pendências abertas') + ' no diário' };
    return e;
  }
  renderVals() {
    const s = this.state, ex = s.exec || {}, D = window.CapitaoDados || {}, S = D.snapshot || {}, AG = D.agenda || [];
    const TOM = { crit: ['var(--cap-crit, #ff3b30)', 'rgba(var(--cap-crit-rgb, 255,59,48), 0.14)'], warn: ['var(--cap-warn, #f0a63a)', 'rgba(var(--cap-warn-rgb, 240,166,58), 0.14)'], tele: ['var(--cap-tele, #00f4fd)', 'rgba(var(--cap-tele-rgb, 0,244,253), 0.12)'], accent: ['var(--cap-accent, #00a1fe)', 'rgba(var(--cap-accent-rgb, 0,161,254), 0.12)'], ok: ['var(--cap-ok, #34c77a)', 'rgba(var(--cap-ok-rgb, 52,199,122), 0.14)'], violeta: ['var(--cap-violeta, #b45cff)', 'rgba(var(--cap-violeta-rgb, 162,43,253), 0.14)'] };
    const cor = (k) => TOM[k] || TOM.accent;
    const atr = AG.filter((t) => t.dn < 0 && !ex[t.id]), n = atr.length;
    const lista = s.blocos || this.padrao();
    const est = this.estados(D, ex, s.diarioLocal);
    const blocos = lista.map((b) => {
      const c = this.porId(b.id), ic = this.ICONES[b.icon] || this.ICONES[c.icon], k = cor(ic.tom), e = est[b.id] || { sub: 'SEM DADOS' };
      const badge = e.badge ? String(e.badge) : '';
      return { href: this.hrefDe(c), label: b.label, sub: e.sub, subTom: e.tom || 'var(--cap-ink3, #97a3c0)', badge: badge, ico: this.ico(ic.d, 20, 1.7, k[0]), wash: k[1],
        aria: b.label + ' — ' + e.sub + (badge ? ' · ' + badge + (badge === '1' ? ' tarefa atrasada' : ' tarefas atrasadas') : '') + (c.q ? ' · pergunta pronta' : '') };
    });
    const salvo = !!s.blocos;
    return {
      atr: String(n), atrTitle: n === 1 ? 'Manutenção atrasada' : n ? n + ' manutenções atrasadas' : 'Nada atrasado',
      atrSub: n ? atr.map((t) => t.equip.split(' (')[0] + ' · ' + (-t.dn) + ' d').join(' · ') : 'Executadas registradas no diário · ' + AG.length + ' tarefas',
      atrTone: n ? 'var(--cap-crit, #ff3b30)' : 'var(--cap-ok, #34c77a)', atrWash: n ? 'rgba(var(--cap-crit-rgb, 255,59,48), 0.12)' : 'rgba(var(--cap-ok-rgb, 52,199,122), 0.12)', atrLine: n ? 'rgba(var(--cap-crit-rgb, 255,59,48), 0.40)' : 'var(--cap-line, #1a2240)',
      atrAria: (n ? n + (n === 1 ? ' manutenção atrasada' : ' manutenções atrasadas') : 'Nada atrasado') + ' — abrir manutenção',
      blocosTitulo: 'BLOCOS · ' + blocos.length + ' DE ' + this.MAX,
      blocosSub: salvo ? 'personalizados neste aparelho' : 'padrão · personalize em Editar',
      blocos: blocos, vazio: blocos.length === 0,
      aparelho: 'a escolha dos blocos fica salva só aqui; SOS e a barra do assistente são fixos.',
      fonte: 'Fonte: ' + ((S.fonte || 'coletor NMEA') + ' · ' + (S.quando || 'SEM DADOS')) + ' · ' + (D.agendaFonte || 'agenda SEM DADOS').split(' · ')[0] + ' · ' + (D.docsFonte || 'documentos SEM DADOS').split(' · ')[0] + ' · ' + (D.diarioFonte || 'diário SEM DADOS').split(' · ')[0]
    };
  }
