<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capitão IA — Checklists (app)</title>
<script src="./capitao-dados.js"></script>
<script src="./capitao-replay.js"></script>
<script src="./capitao-alertas.js"></script>
<script src="./capitao-auth.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./capitao-app.js"></script>
<script src="./capitao-theme.js"></script>
<style>
body { margin: 0; font-family: "Nimbus Sans", "Helvetica Neue", Helvetica, Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--cap-bg, #050816); -webkit-font-smoothing: antialiased; }
a { color: var(--cap-accent, #00a1fe); } a:hover { color: var(--cap-link-hover, #5cc2ff); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--cap-accent, #00a1fe); outline-offset: 2px; }
button { font: inherit; }
</style>
<script src="./capitao-telemetria.js"></script>
<script src="./capitao-brain.js"></script>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--cap-bg, #050816); color: var(--cap-ink, #eaf1ff); overflow: hidden; position: relative;">
  <x-import component-from-global-scope="capitao-topo-app" from="./capitao-moldura.js" titulo="Checklists" voltar="C2-Leme-Mobile.dc.html" hint-size="390px,44px"></x-import>

  <div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto;">

    <div role="tablist" aria-label="Checklists" style="flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: var(--cap-card, #0d1329); border: 1px solid var(--cap-line, #1a2240);">
      <sc-for list="{{abas}}" as="a" hint-placeholder-count="4">
        <button type="button" role="tab" data-c4="aba" data-tipo="{{a.id}}" onClick="{{a.on}}" aria-selected="{{a.ativa}}" style="min-width: 0; height: 48px; border-radius: 10px; border: none; background: {{a.bg}}; color: {{a.tone}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; padding: 0 2px;">
          <span style="font-size: 11.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">{{a.l}}</span>
          <span data-c4="aba-conta" style="font-size: 10.5px; font-weight: 700; opacity: 0.9; font-variant-numeric: tabular-nums;">{{a.n}}</span>
        </button>
      </sc-for>
    </div>

    <section aria-label="Andamento" style="flex-shrink: 0; box-sizing: border-box; padding: 12px 14px; background: var(--cap-card, #0d1329); border: 1px solid var(--cap-line, #1a2240); border-radius: 16px; display: flex; flex-direction: column; gap: 7px;">
      <span style="display: flex; align-items: baseline; gap: 8px;">
        <span data-c4="titulo" style="flex-grow: 1; min-width: 0; font-size: 15px; font-weight: 800;">{{titulo}}</span>
        <span data-c4="conta" style="font-size: 13px; font-weight: 800; color: {{tomCor}}; font-variant-numeric: tabular-nums;">{{conta}}</span>
      </span>
      <span style="display: block; height: 8px; border-radius: 4px; background: var(--cap-track, #1f2740); overflow: hidden;"><span style="display: block; height: 8px; border-radius: 4px; width: {{barW}}; background: {{tomCor}};"></span></span>
      <span style="font-size: 11.5px; line-height: 1.35; color: var(--cap-ink3, #97a3c0);">{{andamento}}</span>
      <span data-c4="resumo" style="font-size: 11px; line-height: 1.35; color: var(--cap-ink4, #7985a6);">{{resumo}}</span>
    </section>

    <sc-if value="{{temAviso}}" hint-placeholder-val="{{false}}">
      <div data-c4="aviso" role="status" style="flex-shrink: 0; display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; padding: 8px 8px 8px 12px; border-radius: 12px; background: {{avisoBg}}; border: 1px solid {{avisoLine}};">
        <span style="flex: 1 1 180px; min-width: 0; font-size: 12px; font-weight: 600; line-height: 1.35; color: var(--cap-ink, #eaf1ff); overflow-wrap: anywhere;">{{note}}</span>
        <sc-if value="{{temDiario}}" hint-placeholder-val="{{false}}"><a href="G3-Diario-Mobile.dc.html" style="margin-left: auto; min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(var(--cap-accent-rgb, 0,161,254), 0.45); color: var(--cap-accent, #00a1fe); font-size: 11.5px; font-weight: 800; display: flex; align-items: center; text-decoration: none;">VER NO DIÁRIO ›</a></sc-if>
      </div>
    </sc-if>

    <section aria-label="Itens" style="flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;">
      <sc-for list="{{itens}}" as="i" hint-placeholder-count="8">
        <div data-c4="item" data-item="{{i.id}}" data-feito="{{i.feitoTxt}}" style="box-sizing: border-box; display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px 8px 8px; border-radius: 14px; background: var(--cap-card, #0d1329); border: 1px solid {{i.line}};">
          <button type="button" data-c4="marca" onClick="{{i.on}}" aria-pressed="{{i.feito}}" aria-label="{{i.aria}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; border: 1.5px solid {{i.boxLine}}; background: {{i.boxBg}}; color: {{i.boxTone}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">{{i.check}}</button>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-top: 1px;">
            <span style="font-size: 13.5px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; color: {{i.tTone}};">{{i.t}}</span>
            <sc-if value="{{i.temAuto}}" hint-placeholder-val="{{false}}">
              <span style="display: flex; align-items: flex-start; gap: 6px;">
                <span data-c4="auto-rotulo" style="flex-shrink: 0; padding: 2px 7px; border-radius: 999px; background: {{i.aWash}}; color: {{i.aTone}}; font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; white-space: nowrap;">{{i.aRot}}</span>
                <span data-c4="auto-valor" style="min-width: 0; font-size: 11.5px; line-height: 1.35; color: var(--cap-ink2, #b1bdd6); overflow-wrap: anywhere;">{{i.aValor}}</span>
              </span>
            </sc-if>
            <span data-c4="fonte" style="font-size: 10.5px; line-height: 1.35; color: var(--cap-ink4, #7985a6); overflow-wrap: anywhere;">Fonte: {{i.fonte}}</span>
            <sc-if value="{{i.temLink}}" hint-placeholder-val="{{false}}">
              <a href="{{i.href}}" data-c4="link" style="align-self: flex-start; display: flex; align-items: center; min-height: 44px; font-size: 12px; font-weight: 700; text-decoration: none;">{{i.linkL}}</a>
            </sc-if>
          </span>
        </div>
      </sc-for>
    </section>

    <section aria-label="Concluir" style="flex-shrink: 0; box-sizing: border-box; padding: 12px 14px; background: var(--cap-card, #0d1329); border: 1px solid var(--cap-line, #1a2240); border-radius: 16px; display: flex; flex-direction: column; gap: 8px;">
      <span data-c4="pend" style="font-size: 12px; line-height: 1.4; color: var(--cap-ink2, #b1bdd6);">{{pendTxt}}</span>
      <span style="display: flex; gap: 8px;">
        <button type="button" data-c4="concluir" onClick="{{conclui}}" style="flex-grow: 1; height: 48px; border-radius: 12px; border: none; background: var(--cap-accent, #00a1fe); color: var(--cap-on-accent, #050816); font-size: 13px; font-weight: 800; letter-spacing: 0.04em; cursor: pointer;">CONCLUIR NO DIÁRIO</button>
        <button type="button" data-c4="zera" onClick="{{zera}}" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--cap-line2, #27315a); background: transparent; color: var(--cap-ink2, #b1bdd6); font-size: 12.5px; font-weight: 700; cursor: pointer; flex-shrink: 0;">Recomeçar</button>
      </span>
      <span style="font-size: 10.5px; line-height: 1.4; color: var(--cap-ink4, #7985a6);">{{nota}}</span>
    </section>
  </div>

  <x-import component-from-global-scope="capitao-sos-app" from="./capitao-moldura.js" hint-size="390px,68px"></x-import>
  <div style="flex-shrink: 0; box-sizing: border-box; padding: 26px 16px 12px; border-top: 1px solid var(--cap-line, #1a2240);">
    <x-import component-from-global-scope="capitao-barra-chat" from="./capitao-barra.js" hint-size="358px,108px"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // tipo pelo #tipo=saida|chegada|abastecimento|fundeio (a C2, a E1 e o chat chegam já na aba certa); `vivo` guarda o texto do último tique (só redesenha se ele mudou)
  state = { tipo: 'saida', vivo: '', note: '', noteTone: 'ok', diario: false };
  tipoDoHash() { const m = /tipo=([a-z]+)/.exec(location.hash || ''); return m ? m[1] : null; }
  componentDidMount() {
    const t = this.tipoDoHash(); if (t) this.setState({ tipo: t });
    this._hash = () => { const x = this.tipoDoHash(); if (x && x !== this.state.tipo) this.setState({ tipo: x }); };
    window.addEventListener('hashchange', this._hash);
    // marcações, diário, Executado e tarefas feitos em outra aba (e o tique da telemetria, os alertas e a virada do dia, que mudam os itens conferidos pelo quadro): relê; só chama setState se o texto mudou
    this._st = (e) => { if (!e || e.key === null || /^capitao\.(checklist|diario|executado|tarefas|docs)\.v1$/.test(e.key)) this.atualiza(); };
    window.addEventListener('storage', this._st);
    this._onTele = () => { if (!document.hidden) this.atualiza(); };
    ['capitao-telemetria', 'capitao-alerta', 'capitao-rebase'].forEach((ev) => window.addEventListener(ev, this._onTele));
    this.whenBrain((B) => { try { if (B.carregaFaq) B.carregaFaq().then(() => { if (!this._dead) this.atualiza(); }); } catch (e) {} this.atualiza(); });
    this.atualiza();
  }
  componentWillUnmount() {
    this._dead = true;
    window.removeEventListener('hashchange', this._hash); window.removeEventListener('storage', this._st);
    ['capitao-telemetria', 'capitao-alerta', 'capitao-rebase'].forEach((ev) => window.removeEventListener(ev, this._onTele));
    clearTimeout(this._n); clearInterval(this._b);
  }
  whenBrain(cb) {
    if (window.CapitaoBrain) return cb(window.CapitaoBrain);
    let n = 0;
    this._b = setInterval(() => {
      if (window.CapitaoBrain || ++n > 120) { clearInterval(this._b); if (window.CapitaoBrain) cb(window.CapitaoBrain); return; }
      if (n === 6 && !document.querySelector('script[data-capitao-brain]')) { const s = document.createElement('script'); s.src = './capitao-brain.js'; s.setAttribute('data-capitao-brain', '1'); document.head.appendChild(s); }
    }, 50);
  }
  atualiza() {
    const d = this.dinamico(), k = JSON.stringify(d);
    if (k === this._k) return;
    this._k = k; this._din = d; this._fresco = true;
    this.setState({ vivo: k });
  }
  ico(d, n, sw, stroke) { const h = React.createElement; return h('svg', { width: n, height: n, viewBox: '0 0 24 24', fill: 'none', 'aria-hidden': 'true', style: { flexShrink: 0, display: 'block' } }, h('path', { d: d, strokeWidth: sw || 1.7, strokeLinecap: 'round', strokeLinejoin: 'round', style: { stroke: stroke || 'currentColor' } })); }
  aviso(msg, tone, diario, ms) {
    this.setState({ note: msg, noteTone: tone || 'ok', diario: !!diario });
    clearTimeout(this._n); this._n = setTimeout(() => this.setState({ note: '', diario: false }), ms || 4000);
  }
  aba(t) {
    this.setState({ tipo: t });
    try { history.replaceState(null, '', '#tipo=' + t); } catch (e) {}
  }
  // ✓ do quadro pode ser desmarcado: fica «não conferido» até a pessoa tocar de novo (volta ao automático)
  alterna(i) {
    const B = window.CapitaoBrain; if (!B) return;
    const tipo = this._tipo;
    if (i.porQuadro) { B.checklistMarca(tipo, i.id, 'n'); this.atualiza(); return this.aviso('Marcado como NÃO conferido (o app dizia: ' + i.aValor + ') — toque de novo para voltar', 'warn'); }
    if (i.anulado) B.checklistMarca(tipo, i.id, false); else B.checklistMarca(tipo, i.id, !i.manual);
    this.atualiza();
  }
  // CONCLUIR: UMA linha nova no diário (só com o toque; o registro só cresce, nada se apaga) com o placar e os pendentes; as marcações em andamento saem do aparelho
  conclui() {
    const B = window.CapitaoBrain; if (!B || Date.now() - (this._tq || 0) < 1500) return; this._tq = Date.now();
    let r = null; try { r = B.checklistConcluir(this._tipo); } catch (e) { r = null; }
    this.atualiza();
    if (!r || !r.entrada) return this.aviso('Não gravado — anote o checklist no diário de bordo.', 'warn');
    this.aviso('No diário: ' + r.t, 'ok', true, 10000);
  }
  zera() { const B = window.CapitaoBrain; if (!B) return; B.checklistZera(this._tipo); this.atualiza(); this.aviso('Marcações apagadas neste aparelho'); }
  // Tudo o que a tela mostra, em texto puro: os itens, a fonte e a verificação pelo quadro vêm do cérebro (B.checklist*, do D.checklists gerado e do instante do CapitaoAgora); nada fixo na tela.
  dinamico() {
    const D = window.CapitaoDados || {}, A = window.CapitaoAgora || {}, B = window.CapitaoBrain, s = this.state, sim = D.simulacao === true;
    const num = (x) => typeof x === 'number' && isFinite(x), cap1 = (t) => { t = String(t || ''); return t.charAt(0).toUpperCase() + t.slice(1); };
    let tipos = []; try { tipos = B && typeof B.checklistTipos === 'function' ? B.checklistTipos() : []; } catch (e) { tipos = []; }
    if (!tipos.length) return { pronto: false, tipo: s.tipo, resumo: 'Carregando os checklists…', abas: [], itens: [], titulo: '', andamento: '', conta: '', barW: '0%', feitos: 0, total: 0, pendTxt: '', nota: '' };
    const tipo = tipos.filter((t) => t.id === s.tipo)[0] || tipos[0];
    this._tipo = tipo.id;
    const L = {}; tipos.forEach((t) => { try { L[t.id] = B.checklistItens(t.id); } catch (e) { L[t.id] = []; } });
    const lista = L[tipo.id], feitos = lista.filter((i) => i.feito).length, total = lista.length, pq = lista.filter((i) => i.porQuadro).length;
    let I = null; try { I = typeof B.instante === 'function' ? B.instante() : (typeof A.instante === 'function' ? A.instante() : null); } catch (e) { I = null; }
    const fonteTxt = I ? (I.fonte === 'snapshot' ? 'Última leitura · ' + String(I.fonteTxt || '').replace(/^.*leitura de /, '') : cap1(I.fonteTxt)) : (sim ? '—' : 'Leitura SEM LEITURA');
    const faq = (id) => { try { return id && B.faqItem ? B.faqItem(id) : null; } catch (e) { return null; } };
    const itens = lista.map((i) => {
      const f = i.faq ? faq(i.faq) : null;
      return { id: i.id, c: i.c, t: i.t, fonte: i.fonte, feito: !!i.feito, manual: !!i.manual, anulado: !!i.anulado, porQuadro: !!i.porQuadro, parcial: !!i.parcial,
        aEstado: i.auto ? i.auto.estado : '', aValor: i.auto ? String(i.auto.valor) : '',
        link: i.link ? i.link : f ? 'faq' : '', faq: i.faq || '', faqPergunta: f ? f.pergunta : '' };
    });
    const pend = lista.filter((i) => !i.feito).map((i) => i.c);
    return {
      pronto: true, tipo: tipo.id, nome: tipo.nome, sys: tipo.sys,
      resumo: 'Itens dos guias de bordo (fonte em cada linha) · o que o quadro confirma já vem marcado · ' + fonteTxt,
      abas: tipos.map((x) => { const l = L[x.id], n = l.filter((i) => i.feito).length; return { id: x.id, l: x.l, aba: x.aba, n: n + '/' + l.length, tudo: n === l.length && l.length > 0, ativa: x.id === tipo.id }; }),
      titulo: tipo.nome, andamento: (pq ? pq + (pq === 1 ? ' item conferido' : ' itens conferidos') + ' pelo quadro · ' : '') + 'toque no quadrado ao conferir; «boa prática» é procedimento comum de marinharia.',
      itens: itens, conta: feitos + '/' + total, barW: total ? Math.round(feitos / total * 100) + '%' : '0%', feitos: feitos, total: total,
      pendTxt: pend.length ? 'Pendentes: ' + pend.join(', ') + '. Pode concluir assim mesmo — os pendentes vão para a linha do diário.' : 'Tudo conferido. Conclua para registrar no diário.',
      nota: 'Concluir grava uma linha nova no diário (categoria ' + tipo.sys + ') com o placar e os pendentes. As marcações em andamento ficam só neste aparelho.',
      agoraFonte: fonteTxt
    };
  }
  renderVals() {
    const s = this.state;
    // o texto do tique que acabou de chamar o setState vale; qualquer outro redesenho (aba, aviso) refaz o texto agora
    let d = this._din;
    if (!this._fresco || !d) { d = this._din = this.dinamico(); this._k = JSON.stringify(d); }
    this._fresco = false;
    const EST = { ok: ['TELEMETRIA ✓', 'var(--cap-ok, #34c77a)', 'rgba(var(--cap-ok-rgb, 52,199,122), 0.14)'], falta: ['ATENÇÃO', 'var(--cap-crit, #ff3b30)', 'rgba(var(--cap-crit-rgb, 255,59,48), 0.14)'],
      ler: ['CONFIRA', 'var(--cap-warn, #f0a63a)', 'rgba(var(--cap-warn-rgb, 240,166,58), 0.14)'], sem: ['SEM LEITURA', 'var(--cap-ink3, #97a3c0)', 'rgba(var(--cap-ink2-rgb, 177,189,214), 0.12)'] };
    const CHECK = 'M5 12.5l4.5 4.5L19 7.5';
    const LINK = { 'G3-Diario': ['G3-Diario-Mobile.dc.html', 'Abrir o Diário ›'], 'G2-Abastecimento': ['G2-Abastecimento-Mobile.dc.html', 'Abrir Abastecimento ›'] };
    const abas = (d.abas || []).map((x) => ({ id: x.id, l: x.id === 'abastecimento' ? 'Abastecer' : x.l, n: x.n, ativa: x.ativa,
      tone: x.tudo ? 'var(--cap-ok, #34c77a)' : x.ativa ? 'var(--cap-accent, #00a1fe)' : 'var(--cap-ink2, #b1bdd6)', bg: x.ativa ? 'rgba(var(--cap-accent-rgb, 0,161,254), 0.16)' : 'transparent', on: () => this.aba(x.id) }));
    const itens = (d.itens || []).map((i) => {
      const e = i.aEstado ? EST[i.aEstado] || EST.sem : null, falta = i.aEstado === 'falta' && !i.feito;
      const link = i.link && LINK[i.link] ? LINK[i.link] : i.link === 'faq' && i.faqPergunta ? ['F6-FAQ-Equipamentos.dc.html#id=' + encodeURIComponent(i.faq), 'FAQ ' + i.faq + ' — passo a passo ›'] : null;
      return { id: i.id, t: i.t, fonte: i.fonte, feito: i.feito, feitoTxt: i.feito ? (i.porQuadro ? 'quadro' : 'pessoa') : i.anulado ? 'anulado' : 'aberto', temAuto: !!e, aRot: e ? e[0] : '', aTone: e ? e[1] : '', aWash: e ? e[2] : '', aValor: i.aValor,
        tTone: i.feito ? 'var(--cap-ink2, #b1bdd6)' : 'var(--cap-ink, #eaf1ff)',
        line: falta ? 'rgba(var(--cap-crit-rgb, 255,59,48), 0.45)' : i.feito ? 'rgba(var(--cap-ok-rgb, 52,199,122), 0.30)' : 'var(--cap-line, #1a2240)',
        boxLine: i.feito ? (i.porQuadro ? 'var(--cap-tele, #00f4fd)' : 'var(--cap-ok, #34c77a)') : 'var(--cap-line2, #27315a)',
        boxBg: i.feito ? (i.porQuadro ? 'rgba(var(--cap-tele-rgb, 0,244,253), 0.14)' : 'rgba(var(--cap-ok-rgb, 52,199,122), 0.14)') : 'transparent',
        boxTone: i.porQuadro ? 'var(--cap-tele, #00f4fd)' : 'var(--cap-ok, #34c77a)', check: i.feito ? this.ico(CHECK, 20, 2.4, 'currentColor') : null,
        aria: (i.feito ? 'Conferido' : i.anulado ? 'Não conferido (você desmarcou o ✓ do app)' : 'Marcar como conferido') + (i.porQuadro ? ' (pelo quadro de bordo; toque para desmarcar)' : '') + ': ' + i.t,
        temLink: !!link, href: link ? link[0] : '', linkL: link ? link[1] : '', on: () => this.alterna(i) };
    });
    const tudo = d.pronto && d.feitos === d.total && d.total > 0, tom = tudo ? 'var(--cap-ok, #34c77a)' : 'var(--cap-accent, #00a1fe)', ruim = s.noteTone === 'warn';
    return {
      resumo: d.resumo, abas: abas, titulo: d.titulo, andamento: d.andamento, itens: itens,
      conta: d.conta, barW: d.barW, tomCor: tom, pendTxt: d.pendTxt, nota: d.nota,
      conclui: () => this.conclui(), zera: () => this.zera(),
      temAviso: !!s.note, note: s.note, temDiario: !!(s.diario && s.note), avisoBg: ruim ? 'rgba(var(--cap-warn-rgb, 240,166,58), 0.10)' : 'rgba(var(--cap-ok-rgb, 52,199,122), 0.10)', avisoLine: ruim ? 'rgba(var(--cap-warn-rgb, 240,166,58), 0.40)' : 'rgba(var(--cap-ok-rgb, 52,199,122), 0.40)',
      fonteLinha: d.agoraFonte || ''
    };
  }
}
</script>
</body>
</html>
