<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Desenho esquemático do barco, vista de perfil (proa à direita). Próprio e genérico: serve de fundo aos sensores (referência: popa 0,04 · proa 0,95 · quilha 0,92 · topo 0,08). Só o traço conta: a tela o usa como máscara e pinta com a cor do tema. Toda forma abaixo deste ponto é a mesma de antes, nas mesmas coordenadas (os sensores do D.sensores apontam para elas); o detalhe novo (iate a motor de luxo, aberto, com arco e capota) só soma camada, sem mover nada. -->
  <!-- casco -->
  <path d="M52 198 L62 300 C80 325 140 331 300 331 L780 331 C930 331 1040 300 1120 235 C1132 224 1140 214 1140 204 C1000 197 800 192 600 194 C400 196 200 197 52 198 Z" fill="#fff" fill-opacity="0.06"/>
  <path d="M62 300 C100 296 160 296 240 296 M700 296 C860 296 1000 280 1100 250" stroke-opacity="0.35"/>
  <!-- linha d'água e ondas -->
  <path d="M30 290 L1100 290" stroke-dasharray="10 8" stroke-opacity="0.55"/>
  <path d="M20 302 q14 -8 28 0 t28 0 M1110 276 q12 -7 24 0 t24 0" stroke-opacity="0.45"/>
  <!-- plataforma de popa, leme e hélice -->
  <path d="M30 296 L62 296 M34 296 L34 312 M34 312 L62 312" stroke-opacity="0.7"/>
  <path d="M96 304 L96 326 C96 334 104 334 104 326 L104 304" stroke-opacity="0.8"/>
  <ellipse cx="136" cy="321" rx="6" ry="17" stroke-opacity="0.8"/>
  <path d="M104 321 L300 321" stroke-opacity="0.35" stroke-dasharray="3 6"/>
  <!-- cabine e capota -->
  <path d="M330 194 L342 82 L700 76 L792 188 L800 194" fill="#fff" fill-opacity="0.04"/>
  <path d="M322 82 L710 74 L704 60 L330 66 Z" fill="#fff" fill-opacity="0.12"/>
  <rect x="390" y="107" width="80" height="53" rx="9" fill="#fff" fill-opacity="0.05" stroke-opacity="0.85"/>
  <rect x="488" y="106" width="88" height="54" rx="9" fill="#fff" fill-opacity="0.05" stroke-opacity="0.85"/>
  <rect x="594" y="105" width="88" height="55" rx="9" fill="#fff" fill-opacity="0.05" stroke-opacity="0.85"/>
  <path d="M700 82 L778 182" stroke-opacity="0.85"/>
  <path d="M600 160 L606 194" stroke-opacity="0.45"/>
  <!-- torre/arco do radar, numa base sobre a capota, com mastro da antena de GPS -->
  <path d="M548 63 L548 48 C548 44 552 41 558 41 L652 41 C658 41 662 44 662 48 L662 63" fill="#fff" fill-opacity="0.07" stroke-opacity="0.9"/>
  <path d="M562 41 L562 28 L640 28 L640 41" stroke-opacity="0.9"/>
  <path d="M562 36 L640 33" stroke-opacity="0.4"/>
  <path d="M649 48 L649 46"/>
  <circle cx="649" cy="42" r="4.5"/>
  <!-- pulpito reforçado e roldana da âncora na proa -->
  <path d="M808 194 L808 164 L906 164 M906 164 L944 188" stroke-opacity="0.75"/>
  <path d="M812 180 L900 180 L934 198" stroke-opacity="0.4"/>
  <path d="M1110 226 L1142 222" stroke-opacity="0.75"/>
  <!-- praça de máquinas -->
  <path d="M250 232 L560 232 L560 316 L250 316 Z" stroke-dasharray="8 6" stroke-opacity="0.6"/>
  <rect x="285" y="262" width="130" height="48" rx="5" stroke-opacity="0.75"/>
  <path d="M300 262 L300 252 M330 262 L330 252 M360 262 L360 252 M390 262 L390 252" stroke-opacity="0.6"/>
  <circle cx="539" cy="271" r="17" stroke-opacity="0.8"/>
  <circle cx="539" cy="271" r="6" stroke-opacity="0.6"/>
  <!-- tanques de combustível e água (sombras) -->
  <path d="M600 306 L860 306 L860 322 L600 322 Z" stroke-opacity="0.3"/>
  <!-- sonda no casco -->
  <path d="M719 331 L719 322 L731 322 L731 331" stroke-opacity="0.8"/>
  <!-- piso da cabine -->
  <path d="M342 224 L780 224" stroke-opacity="0.4" stroke-dasharray="14 8"/>

  <!-- === reforço de detalhe (iate a motor aberto, de luxo) — só soma, nada do que está acima mudou === -->
  <!-- friso de casco (dois tons) e sombra da quilha -->
  <path d="M50 272 C96 266 160 263 250 263 M690 263 C850 260 1000 242 1116 206" stroke-opacity="0.45"/>
  <path d="M60 334 C300 340 780 340 1110 300" stroke-opacity="0.15"/>
  <!-- escovéns no costado, a ré da cabine -->
  <circle cx="378" cy="258" r="8" stroke-opacity="0.45"/>
  <circle cx="462" cy="258" r="8" stroke-opacity="0.45"/>
  <circle cx="546" cy="258" r="8" stroke-opacity="0.45"/>
  <!-- friso da para-brisa (dupla camada) e calha de drenagem do teto -->
  <path d="M706 90 L782 186" stroke-opacity="0.4"/>
  <path d="M330 72 L710 64" stroke-opacity="0.3"/>
  <!-- poltronas em L no cockpit aberto -->
  <path d="M112 302 L112 318 L188 318 M188 266 L188 318" stroke-opacity="0.4"/>
  <!-- escada de acesso ao passadiço, a ré da cabine -->
  <path d="M792 182 L808 174" stroke-opacity="0.4" stroke-dasharray="3 5"/>
  <!-- escapamentos perto da linha d'água -->
  <ellipse cx="58" cy="284" rx="5" ry="3" stroke-opacity="0.55"/>
  <ellipse cx="58" cy="298" rx="5" ry="3" stroke-opacity="0.55"/>
  <!-- textura do piso do cockpit e da plataforma de popa -->
  <path d="M120 326 L290 326 M40 304 L62 304" stroke-opacity="0.22" stroke-dasharray="4 7"/>
</svg>
