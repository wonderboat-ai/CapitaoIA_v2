<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Desenho esquemático do barco, vista de cima (proa à direita, bombordo em cima). Próprio e genérico: serve de fundo aos sensores (referência: popa 0,04 · proa 0,95 · eixo 0,5 · meia-boca 0,32). Só o traço conta: a tela o usa como máscara e pinta com a cor do tema. Toda forma abaixo deste ponto é a mesma de antes, nas mesmas coordenadas (os sensores do D.sensores apontam para elas); o detalhe novo só soma camada, sem mover nada. -->
  <!-- casco -->
  <path d="M48 106 L48 314 C120 336 280 344 430 344 C700 344 930 300 1140 210 C930 120 700 76 430 76 C280 76 120 84 48 106 Z" fill="#fff" fill-opacity="0.05"/>
  <path d="M70 118 C130 98 280 90 430 90 C690 90 900 128 1100 210 C900 292 690 330 430 330 C280 330 130 322 70 302" stroke-opacity="0.35"/>
  <!-- linha de centro -->
  <path d="M40 210 L1130 210" stroke-dasharray="14 10" stroke-opacity="0.3"/>
  <!-- popa: plataforma, leme e hélices -->
  <path d="M30 150 L48 150 M30 270 L48 270 M30 150 L30 270" stroke-opacity="0.6"/>
  <path d="M92 196 L92 224 M84 210 L100 210" stroke-opacity="0.8"/>
  <path d="M150 156 L240 156 M150 264 L240 264" stroke-opacity="0.3" stroke-dasharray="3 6"/>
  <ellipse cx="132" cy="156" rx="5" ry="15" stroke-opacity="0.6"/><ellipse cx="132" cy="264" rx="5" ry="15" stroke-opacity="0.6"/>
  <!-- cockpit e cabine -->
  <path d="M130 130 L330 130 L330 290 L130 290 Z" stroke-opacity="0.45"/>
  <path d="M350 112 L690 120 L770 210 L690 300 L350 308 Z" fill="#fff" fill-opacity="0.04" stroke-opacity="0.8"/>
  <path d="M700 132 L752 210 L700 288" stroke-opacity="0.55"/>
  <!-- praça de máquinas: motores, gerador e baterias -->
  <path d="M196 120 L560 120 L560 300 L196 300 Z" stroke-dasharray="8 6" stroke-opacity="0.45"/>
  <rect x="261" y="134" width="120" height="44" rx="5" stroke-opacity="0.8"/><rect x="261" y="242" width="120" height="44" rx="5" stroke-opacity="0.8"/>
  <path d="M261 156 L170 156 M261 264 L170 264" stroke-opacity="0.45"/>
  <rect x="208" y="188" width="74" height="44" rx="5" stroke-opacity="0.8"/>
  <rect x="358" y="180" width="36" height="20" rx="3" stroke-opacity="0.7"/><rect x="358" y="220" width="36" height="20" rx="3" stroke-opacity="0.7"/>
  <circle cx="288" cy="176" r="6" stroke-opacity="0.7"/><circle cx="288" cy="244" r="6" stroke-opacity="0.7"/>
  <circle cx="408" cy="237" r="14" stroke-opacity="0.7"/>
  <!-- tanques -->
  <rect x="408" y="100" width="110" height="60" rx="6" stroke-opacity="0.8"/><rect x="408" y="260" width="110" height="60" rx="6" stroke-opacity="0.8"/>
  <rect x="658" y="176" width="90" height="68" rx="6" stroke-opacity="0.8"/>
  <rect x="776" y="232" width="72" height="38" rx="6" stroke-opacity="0.7"/>
  <rect x="630" y="226" width="38" height="22" rx="3" stroke-opacity="0.7"/>
  <!-- proa: convés, guincho e corrente -->
  <path d="M770 210 L1100 210" stroke-opacity="0.2"/>
  <circle cx="1085" cy="210" r="13" stroke-opacity="0.8"/><circle cx="1085" cy="210" r="5" stroke-opacity="0.6"/>
  <path d="M1000 160 L1100 196 M1000 260 L1100 224" stroke-opacity="0.3"/>

  <!-- === reforço de detalhe (iate a motor aberto, de luxo) — só soma, nada do que está acima mudou === -->
  <!-- passadiços laterais entre a cabine e a borda -->
  <path d="M352 108 L352 68 M690 116 L690 72" stroke-opacity="0.25"/>
  <path d="M352 312 L352 328 M690 304 L690 318" stroke-opacity="0.25"/>
  <!-- friso de vigias no costado da cabine -->
  <path d="M382 120 L398 119 M418 118 L434 118 M454 118 L470 119 M490 119 L506 120 M526 121 L542 122 M562 123 L578 124 M598 125 L614 126 M634 127 L650 128" stroke-opacity="0.55"/>
  <path d="M382 300 L398 301 M418 302 L434 302 M454 301 L470 300 M490 300 L506 299 M526 298 L542 297 M562 296 L578 295 M598 294 L614 293 M634 292 L650 291" stroke-opacity="0.55"/>
  <!-- arco do radar, visto de cima (apoio sobre a cabine) -->
  <rect x="578" y="178" width="84" height="64" rx="8" fill="#fff" fill-opacity="0.08" stroke-opacity="0.55"/>
  <!-- poltronas em L no cockpit aberto -->
  <path d="M148 150 L148 270 M148 150 L240 150" stroke-opacity="0.35"/>
  <!-- linha de through-hull / spray rail, mais próxima do costado -->
  <path d="M86 128 C150 112 290 104 430 104 C670 104 870 138 1060 210 C870 282 670 316 430 316 C290 316 150 308 86 292" stroke-opacity="0.18"/>
  <!-- buzinotes (cleats) no convés -->
  <path d="M64 130 L80 130 M64 290 L80 290" stroke-opacity="0.4"/>
  <path d="M1060 172 L1072 180 M1060 248 L1072 240" stroke-opacity="0.4"/>
  <!-- grade de proa fechando a roldana -->
  <path d="M1000 160 L1040 150 M1000 260 L1040 270" stroke-opacity="0.3"/>
</svg>
